name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: validate plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test the validation library
        run: python3 scripts/test_pluginlib.py

      - name: Validate every plugin manifest
        run: python3 scripts/validate_plugin.py --all
