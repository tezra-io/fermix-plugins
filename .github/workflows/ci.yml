name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: validate plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Unit-test the validation library
        run: python3 scripts/test_pluginlib.py

      - name: Validate every plugin manifest
        run: python3 scripts/validate_plugin.py --all

      - name: Boundary-check every plugin as it would be packed
        run: python3 scripts/check_plugin_package.py plugins/*/

      - name: Test the Obsidian server's vault path safety
        run: node --test plugins/obsidian/src/vault_paths.test.js
